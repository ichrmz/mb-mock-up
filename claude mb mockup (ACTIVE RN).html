<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CollectorsHub - Motherbase Company Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --line:#e3e5ea; --field:#f1f2f5;
  --ink:#16171c; --dim:#6b7280; --faint:#9aa1ae;
  --red:#d1352c; --blue:#2b5fcf; --green:#1f9d5c; --amber:#c9861f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;}
h1,h2,h3{font-family:'Inter',sans-serif; font-weight:700; margin:0;}
.hidden{display:none !important;}
a{color:inherit;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#d6d8de; border-radius:4px;}

/* ============ AUTH SCREEN ============ */
#screen-auth .wrap{display:flex; min-height:100vh;}
.hero{position:relative; flex:1.05; min-width:0; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:48px 32px;
  background:radial-gradient(ellipse at 18% 25%, rgba(209,53,44,.08), transparent 55%), radial-gradient(ellipse at 82% 75%, rgba(43,95,207,.08), transparent 55%), var(--bg);
  border-right:1px solid var(--line); overflow:hidden;}
.hero-inner{position:relative; z-index:2; text-align:center; max-width:420px;}
.logo-img{width:min(60%,230px); display:block; margin:0 auto 26px; border-radius:10px; box-shadow:0 20px 50px rgba(20,20,30,.16); border:1px solid var(--line);}
.hero h1{letter-spacing:.02em; font-size:clamp(21px,3vw,28px); line-height:1.2; margin-bottom:10px;}
.hero p{color:var(--dim); font-size:15px; line-height:1.6; margin:0;}
.rule{width:64px; height:2px; margin:20px auto; border-radius:1px; background:linear-gradient(90deg,var(--red),var(--blue));}
.auth-panel{flex:1; min-width:0; display:flex; align-items:center; justify-content:center; padding:40px 28px; background:var(--panel);}
.card{width:100%; max-width:380px;}
.tabs{display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; margin-bottom:30px;}
.tab{flex:1; text-align:center; padding:13px 0; cursor:pointer; font-weight:600; font-size:14px; letter-spacing:.02em; color:var(--dim); background:var(--field); border:none;}
.tab.active{color:var(--ink); background:var(--panel); box-shadow:inset 0 -2px 0 var(--red);}
h2.form-title{font-size:22px; margin-bottom:6px; letter-spacing:.01em;}
.sub{color:var(--dim); font-size:13.5px; margin:0 0 24px; line-height:1.5;}
.field{margin-bottom:15px;}
label{display:block; font-size:12px; color:var(--dim); margin-bottom:6px; font-weight:500;}
input,select,textarea{width:100%; padding:11px 13px; background:var(--field); border:1px solid var(--line); color:var(--ink); font-size:14px; font-family:'Inter',sans-serif; border-radius:4px;}
input::placeholder{color:var(--faint);}
input:focus,select:focus,textarea:focus{border-color:var(--blue); background:#fff; outline:none;}
.row2{display:flex; gap:12px;} .row2 .field{flex:1;}
.btn{padding:12px 22px; cursor:pointer; font-weight:600; font-size:14px; letter-spacing:.01em; color:#fff; border:none; border-radius:4px; background:linear-gradient(90deg,var(--red),var(--blue));}
.btn.block{width:100%; margin-top:4px;}
.btn:hover{filter:brightness(1.06);}
.meta-row{display:flex; justify-content:space-between; align-items:center; margin:14px 0 22px; font-size:13px;}
.meta-row label{display:flex; align-items:center; gap:7px; color:var(--dim); font-size:13px; margin:0; font-weight:400;}
.meta-row a{color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line);}
.switch-line{text-align:center; font-size:13px; color:var(--dim); margin-top:22px;}
.switch-line button{background:none; border:none; color:var(--blue); cursor:pointer; font-size:13px; font-family:'Inter',sans-serif; font-weight:600; padding:0;}
form{display:none;} form.active{display:block;}
@media (max-width:820px){ .hero{border-right:none; border-bottom:1px solid var(--line); padding:32px 24px;} .logo-img{width:44%; max-width:160px; margin-bottom:14px;} .hero p{display:none;} }

/* ============ PORTAL SHELL ============ */
#screen-portal{display:flex; min-height:100vh;}
.sidebar{width:240px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
.sb-brand{display:flex; align-items:center; gap:10px; padding:18px 18px; border-bottom:1px solid var(--line);}
.sb-brand img{width:28px; height:28px; object-fit:cover; border-radius:5px; border:1px solid var(--line);}
.sb-brand span{font-weight:700; font-size:14.5px; letter-spacing:.02em;}
.sb-nav{flex:1; padding:12px 10px; overflow-y:auto;}
.sb-item{padding:11px 13px; margin-bottom:2px; border-radius:5px; cursor:pointer; color:var(--dim); font-size:13.5px; font-weight:500; border-left:2px solid transparent;}
.sb-item:hover{background:var(--field); color:var(--ink);}
.sb-item.active{background:var(--field); color:var(--ink); border-left:2px solid var(--red); font-weight:600;}
.sb-foot{padding:14px 18px; border-top:1px solid var(--line); font-size:12px; color:var(--faint);}
.sb-foot b{color:var(--dim); display:block; font-size:13px; margin-bottom:2px; font-weight:600;}
.sb-foot a{color:var(--dim); border-bottom:1px solid var(--line); cursor:pointer;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5;}
.topbar h1{font-size:18px; letter-spacing:.01em;}
.topbar .crumb{color:var(--dim); font-size:12px; margin-top:2px; font-weight:500;}
.top-user{display:flex; align-items:center; gap:10px;}
.avatar{width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--red),var(--blue)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; color:#fff;}
.content{padding:24px 28px 60px; overflow-y:auto;}
.view{display:none;} .view.active{display:block;}

.subtabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:22px; flex-wrap:wrap;}
.subtab{padding:9px 15px; cursor:pointer; font-weight:600; font-size:13px; letter-spacing:.01em; color:var(--dim); border-bottom:2px solid transparent;}
.subtab.active{color:var(--ink); border-bottom:2px solid var(--red);}
.subview{display:none;} .subview.active{display:block;}

.grid{display:grid; gap:14px;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:1000px){ .grid.cols-3,.grid.cols-4{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .grid.cols-3,.grid.cols-4{grid-template-columns:1fr;} }

.stat-card{background:var(--panel); border:1px solid var(--line); padding:17px; border-radius:6px;}
.stat-card .n{font-weight:700; font-size:25px;}
.stat-card .l{color:var(--dim); font-size:12px; margin-top:4px;}
.stat-card .d{font-size:11.5px; margin-top:8px; font-weight:600;}
.d.up{color:var(--green);} .d.down{color:var(--red);}

.panel-box{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:20px; margin-bottom:18px;}
.panel-box h3{font-size:15px; letter-spacing:.01em;}
.panel-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; gap:10px; flex-wrap:wrap;}
.panel-head p{color:var(--dim); font-size:12px; margin:4px 0 0;}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; color:var(--dim); font-weight:600; font-size:11px; letter-spacing:.03em; padding:9px 10px; border-bottom:1px solid var(--line);}
td{padding:11px 10px; border-bottom:1px solid #eef0f3; vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.mono{color:var(--dim); font-size:12px;}

.badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600;}
.badge.active{background:rgba(31,157,92,.12); color:var(--green);}
.badge.archived{background:rgba(107,114,128,.12); color:var(--dim);}
.badge.draft{background:rgba(107,114,128,.12); color:var(--dim);}
.badge.sent{background:rgba(43,95,207,.12); color:var(--blue);}
.badge.received{background:rgba(31,157,92,.12); color:var(--green);}
.badge.published{background:rgba(31,157,92,.12); color:var(--green);}
.badge.needsreview{background:rgba(209,53,44,.12); color:var(--red);}
.badge.scheduled{background:rgba(43,95,207,.12); color:var(--blue);}
.badge.posted{background:rgba(31,157,92,.12); color:var(--green);}

.btn-sm{padding:7px 13px; font-size:12px; border-radius:4px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; font-weight:600;}
.btn-sm:hover{border-color:var(--blue);}
.btn-sm.primary{background:linear-gradient(90deg,var(--red),var(--blue)); border:none; color:#fff;}
.btn-sm.ghost{background:transparent;}

.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:12.5px;}
.bar-row .lbl{width:160px; flex-shrink:0; color:var(--dim);}
.bar-track{flex:1; height:8px; background:var(--field); border-radius:5px; overflow:hidden;}
.bar-fill{height:100%; border-radius:5px; background:linear-gradient(90deg,var(--red),var(--blue));}
.bar-val{width:70px; text-align:right; flex-shrink:0; font-size:12px; color:var(--ink); font-weight:600;}

.toggle{position:relative; width:38px; height:21px; background:var(--field); border:1px solid var(--line); border-radius:20px; cursor:pointer; flex-shrink:0;}
.toggle .dot{position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%; background:var(--faint); transition:.15s;}
.toggle.on{background:rgba(31,157,92,.15); border-color:var(--green);}
.toggle.on .dot{left:19px; background:var(--green);}
.autorow{display:flex; justify-content:space-between; align-items:center; padding:13px 0; border-bottom:1px solid #eef0f3; gap:14px;}
.autorow:last-child{border-bottom:none;}
.autorow .t{font-size:13px; font-weight:600;} .autorow .s{font-size:12px; color:var(--dim); margin-top:2px;}

.msg-item{display:flex; gap:12px; padding:13px 0; border-bottom:1px solid #eef0f3; align-items:flex-start;}
.msg-item:last-child{border-bottom:none;}
.msg-tag{width:38px; height:24px; border-radius:4px; background:var(--field); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:10px; font-weight:700; color:var(--dim); margin-top:2px;}
.msg-item .who{font-weight:600; font-size:13px;} .msg-item .prev{color:var(--dim); font-size:12px; margin-top:3px;}
.msg-item .meta{margin-left:auto; text-align:right; flex-shrink:0; font-size:11px; color:var(--faint);}

.extract-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media (max-width:800px){.extract-grid{grid-template-columns:1fr;}}
.raw-box{background:var(--field); border:1px dashed var(--line); border-radius:5px; padding:14px; font-size:12.5px; color:var(--dim); line-height:1.7; white-space:pre-wrap;}
.field-out{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eef0f3; font-size:13px;}
.field-out .k{color:var(--dim);} .field-out .v{font-weight:600;}

.flag-item{display:flex; gap:10px; align-items:flex-start; padding:12px 0; border-bottom:1px solid #eef0f3;}
.flag-item:last-child{border-bottom:none;}
.flag-item .mk{width:20px; height:20px; border-radius:4px; background:rgba(201,134,31,.15); color:var(--amber); font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;}
.flag-item .t{font-weight:600; font-size:13px;} .flag-item .d2{font-size:12px; color:var(--dim); margin-top:2px;}

.lineage{font-size:13px;}
.lin-l1{font-weight:700; font-size:15px; margin-bottom:8px;}
.lin-l2{padding-left:18px; border-left:1px solid var(--line); margin-left:6px; margin-bottom:10px;}
.lin-l2 .h{font-weight:600; margin-bottom:8px;}
.lin-l3{padding:6px 11px; background:var(--field); border:1px solid var(--line); border-radius:4px; margin-bottom:6px; display:inline-block; margin-right:8px; font-size:12px;}
.lin-add{display:flex; gap:8px; margin-top:6px; max-width:320px;}

.plat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
@media (max-width:700px){.plat-grid{grid-template-columns:1fr;}}
.plat-card{border:1px solid var(--line); border-radius:6px; padding:14px; background:var(--field);}
.plat-card .ph{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.plat-card .pname{font-weight:700; font-size:13.5px;}
.plat-card .ptxt{font-size:12.5px; color:var(--dim); line-height:1.6; margin-bottom:10px;}

.feat-card{display:flex; gap:16px; align-items:center; background:var(--field); border:1px solid var(--line); border-radius:6px; padding:16px;}
.feat-thumb{width:64px; height:64px; border-radius:6px; background:linear-gradient(135deg, rgba(209,53,44,.18), rgba(43,95,207,.18)); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; color:var(--dim);}
.pill-select{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
.pill{padding:6px 13px; border:1px solid var(--line); border-radius:20px; font-size:12px; cursor:pointer; color:var(--dim); background:var(--panel);}
.pill.sel{border-color:var(--blue); color:var(--ink); background:rgba(43,95,207,.08); font-weight:600;}

.alert-card{border:1px solid #f0d3d1; background:#fbf1f0; border-radius:6px; padding:13px 16px; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
.alert-card .nm{font-weight:600; font-size:13px;}
.alert-card .counts{display:flex; gap:16px; font-size:12px; color:var(--dim); align-items:center; flex-wrap:wrap;}
.alert-card .counts b{color:var(--ink); font-weight:700;}

.qr-block{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.qr-img{width:66px; height:66px; background:var(--ink); color:#fff; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:9px; text-align:center; padding:4px; font-weight:700; flex-shrink:0;}

.inline-form{background:var(--field); border:1px solid var(--line); border-radius:6px; padding:16px; margin-bottom:16px;}
.inline-form .grid{grid-template-columns:repeat(3,1fr); margin-bottom:14px;}
@media (max-width:700px){.inline-form .grid{grid-template-columns:1fr 1fr;}}
.inline-form .field{margin-bottom:0;}
.inline-form-actions{display:flex; gap:10px;}
.empty-note{color:var(--dim); font-size:13px; padding:10px 0;}
</style>
</head>
<body>

<section id="screen-auth">
  <div class="wrap">    
    <section class="auth-panel">
      <div class="card">
        <div class="tabs">
          <button class="tab active" id="tab-login" onclick="showAuth('login')">LOG IN</button>
          <button class="tab" id="tab-register" onclick="showAuth('register')">REGISTER</button>
        </div>
        <form id="login" class="active" onsubmit="enterPortal(event)">
          <h2 class="form-title">Welcome back</h2>
          <p class="sub">Log in to your Motherbase staff account.</p>
          <div class="field"><label>Email or username</label><input type="text" placeholder="admin@motherbase.com"></div>
          <div class="field"><label>Password</label><input type="password" placeholder="••••••••"></div>
          <div class="meta-row">
            <label><input type="checkbox" style="width:auto;padding:0;"> Remember me</label>
            <a href="#">Forgot password?</a>
          </div>
          <button class="btn block" type="submit">Log In</button>
          <p class="switch-line">New Administrator? <button type="button" onclick="showAuth('register')">Register</button></p>
        </form>
        <form id="register" onsubmit="enterPortal(event)">
          <h2 class="form-title">Create an account</h2>          
          <div class="field"><label>Full name</label><input type="text" placeholder="Juan Dela Cruz" ></div>
          <div class="row2">
            <div class="field"><label>Username</label><input type="text" placeholder="juandc" ></div>
            <div class="field"><label>Email</label><input type="email" placeholder="you@example.com" ></div>
          </div>
          <div class="field"><label>Password</label><input type="password" placeholder="At least 8 characters" ></div>
          <div class="field"><label>Confirm password</label><input type="password" placeholder="Re-enter password" ></div>
          <button class="btn block" type="submit">Create Account</button>
          <p class="switch-line">Already have an account? <button type="button" onclick="showAuth('login')">Log in</button></p>
        </form>
      </div>
    </section>
  </div>
</section>

<section id="screen-portal" class="hidden">
  <aside class="sidebar">
    <div class="sb-brand"></div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-foot"><b>Admin</b>Administrator · <a onclick="backToAuth(event)">Log out</a></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div><h1 id="tb-title">Dashboard</h1></div>
      <div class="top-user"><div class="avatar">P</div></div>
    </div>
    <div class="content">
      <div class="view active" id="view-dashboard"></div>
      <div class="view" id="view-inventory"></div>
      <div class="view" id="view-supplier"></div>
      <div class="view" id="view-cms"></div>
      <div class="view" id="view-analytics"></div>
    </div>
  </div>
</section>

<script>
/* ================= AUTH ================= */
function showAuth(which){
  document.getElementById('login').classList.toggle('active', which==='login');
  document.getElementById('register').classList.toggle('active', which==='register');
  document.getElementById('tab-login').classList.toggle('active', which==='login');
  document.getElementById('tab-register').classList.toggle('active', which==='register');
}
function enterPortal(e){
  e.preventDefault();
  document.getElementById('screen-auth').classList.add('hidden');
  document.getElementById('screen-portal').classList.remove('hidden');
}
function backToAuth(e){
  e.preventDefault();
  document.getElementById('screen-portal').classList.add('hidden');
  document.getElementById('screen-auth').classList.remove('hidden');
}

/* ================= IN-MEMORY DATA (resets on reload) ================= */

];
let acquisitions=[
 {date:'2026-09-18', product:'RX-78-2 Gundam PG 1/60', supplier:'Ichiban Toys Japan', qty:10, cost:9800},
 {date:'2026-08-02', product:'RX-78-2 Gundam PG 1/60', supplier:'Ichiban Toys Japan', qty:6, cost:9200},
 {date:'2026-09-20', product:'Luffy Gear 5 Ichiban Kuji', supplier:'Banpresto China Direct', qty:15, cost:1450},
 {date:'2026-07-11', product:'Iron Man Mark 46', supplier:'Bandai Direct HK', qty:8, cost:3600},
];
let poList=[
 {po:'PO-1042', supplier:'Hot Toys Distribution HK', items:4, total:74000, status:'sent'},
 {po:'PO-1041', supplier:'Ichiban Toys Japan', items:12, total:112000, status:'received'},
 {po:'PO-1040', supplier:'Banpresto China Direct', items:20, total:29000, status:'draft'},
 {po:'PO-1039', supplier:'Bandai Direct HK', items:6, total:41000, status:'received'},
];
let inbox=[
 {who:'Ichiban Toys Japan', tag:'XLS', prev:'New arrivals list for October - 14 SKUs, prices attached.', when:'Sep 22'},
 {who:'Hot Toys Distribution HK', tag:'PDF', prev:'Spider-Man No Way Home restock photos + spec sheet.', when:'Sep 21'},
 {who:'Banpresto China Direct', tag:'PDF', prev:'Q4 catalog - One Piece line, 40+ SKUs.', when:'Sep 19'},
 {who:'Sideshow Collectibles', tag:'MSG', prev:'Optimus Prime 1:1 Bust - restock ETA and pricing update.', when:'Sep 17'},
];
const extractExamples=[

function money(n){return 'P'+n.toLocaleString();}

function barList(data, unit){
  const max = Math.max(...data.map(d=>d.v));
  return data.map(d=>`<div class="bar-row"><div class="lbl">${d.n}</div><div class="bar-track"><div class="bar-fill" style="width:${(d.v/max*100).toFixed(0)}%"></div></div><div class="bar-val">${unit==='P'?money(d.v):d.v+(unit||'')}</div></div>`).join('');
}
function statusBadge(s){ const map={active:'Active',archived:'Archived',draft:'Draft',sent:'Sent',received:'Received',published:'Published',needsreview:'Needs Review',scheduled:'Scheduled',posted:'Posted'}; return `<span class="badge ${s}">${map[s]||s}</span>`; }

function saveStockUnit(){
  const name=document.getElementById('new-name').value.trim();
  if(!name) return;
  const cat=document.getElementById('new-cat').value.trim()||'General';
  const qty=parseInt(document.getElementById('new-qty').value)||0;
  const price=parseInt(document.getElementById('new-price').value)||0;
  const status=document.getElementById('new-status').value;
  const sku='MB-'+today().replace(/-/g,'').slice(2)+'-'+String(inventoryMatrix.length+100).padStart(4,'0');
  inventoryMatrix.unshift({name,sku,cat,qty,price,status});
  state.showAddStock=false;
  renderInventory();
}
function generateBarcode(idx){
  state.barcodeItem=idx;
  state.lastBarcode = inventoryMatrix[idx].sku+'-'+String(Math.floor(Math.random()*90+10));
  state.activeSub.inventory='barcode';
  renderInventory();
}
function saveAcquisition(){
  const product=document.getElementById('acq-product').value;
  const supplier=document.getElementById('acq-supplier').value.trim()||'Unspecified supplier';
  const qty=parseInt(document.getElementById('acq-qty').value)||0;
  const cost=parseInt(document.getElementById('acq-cost').value)||0;
  acquisitions.unshift({date:today(), product, supplier, qty, cost});
  const item = inventoryMatrix.find(i=>i.name===product);
  if(item){ item.qty += qty; if(state.autoReactivate!==false && item.status==='archived') item.status='active'; }
  state.showAddAcq=false;
  renderInventory();
}
function savePO(){
  const supplier=document.getElementById('po-supplier').value.trim()||'Unspecified supplier';
  const items=parseInt(document.getElementById('po-items').value)||0;
  const total=parseInt(document.getElementById('po-total').value)||0;
  const num='PO-'+(1042+poList.length+1);
  poList.unshift({po:num, supplier, items, total, status:'draft'});
  state.showAddPO=false;
  renderInventory();
}
function advancePO(idx){
  const order=['draft','sent','received'];
  const cur=order.indexOf(poList[idx].status);
  poList[idx].status = order[Math.min(cur+1,2)];
  renderInventory();
}

      ${itemDetails.map((w,i)=>`<tr><td>${w.name}</td><td style="width:200px;"><div class="bar-track" style="display:inline-block;width:110px;vertical-align:middle;"><div class="bar-fill" style="width:${w.pct}%"></div></div> <span class="mono">${w.pct}%</span></td><td>${statusBadge(w.status)}</td><td><button class="btn-sm" onclick="cycleEntryStatus(${i})">Advance status</button></td></tr>`).join('')}
      </tbody></table>
    </div>
  </div>

  <div class="subview ${s==='ai'?'active':''}">
    <div class="panel-box">
      <div class="panel-head"><div><h3>AI Entry Assistant</h3></div></div>
      <div class="extract-grid">
        <div>
          <label>Staff input</label>
          <div class="field-out"><span class="k">Product</span><span class="v">S.H.Figuarts Iron Man Mark 1</span></div>
          <div class="field-out"><span class="k">Manufacturer</span><span class="v">Bandai</span></div>          
          <div class="field-out"><span class="k">Franchise</span><span class="v">Marvel</span></div>
        </div>
        <div>
          <label>AI-generated draft</label>
          <div class="raw-box">Character background: Tony Stark's first armored suit, built in captivity from salvaged parts.
Product history: Released as part of Bandai's S.H.Figuarts Marvel line, based on the MCU debut design.
Trivia: The articulated chest reactor is a fan-favorite feature of this release.</div>
          <div style="margin-top:10px;"><button class="btn-sm primary" ${state.aiDraftApproved?'disabled':''} onclick="state.aiDraftApproved=true; renderCMS();">${state.aiDraftApproved?'Approved':'Approve draft'}</button> <button class="btn-sm" onclick="state.aiDraftApproved=false; renderCMS();">Edit</button></div>
        </div>
      </div>
    </div>
  </div>

  <div class="subview ${s==='verify'?'active':''}">
    <div class="panel-box">
      <div class="panel-head"><div><h3>AI Suggestion & Verification Engine</h3></div></div>
      ${verifyFlags.length? verifyFlags.map((f,i)=>`<div class="flag-item"><div class="mk">!</div><div><div class="t">${f.t}</div><div class="d2">${f.d}</div></div><button class="btn-sm" style="margin-left:auto;" onclick="reviewFlag(${i})">Mark reviewed</button></div>`).join(''):'<div class="empty-note">No open flags - everything checks out.</div>'}
    </div>
  </div>

  <div class="subview ${s==='publisher'?'active':''}">
    <div class="panel-box">
      <div class="panel-head"><div><h3>Multi-Platform Social Posting</h3></div><span class="badge draft">RX-78-2 Gundam PG 1/60</span></div>
      <div class="plat-grid">
        ${socialPosts.map((p,i)=>`<div class="plat-card"><div class="ph"><span class="pname">${p.platform}</span>${statusBadge(p.status)}</div><div class="ptxt">${p.text}</div><button class="btn-sm" onclick="cyclePlatformStatus(${i})">Advance status</button></div>`).join('')}
      </div>
    </div>
  </div>

  <div class="subview ${s==='spotlight'?'active':''}">
    <div class="panel-box">
      <div class="panel-head"><div><h3>Featured Spotlight Editor</h3></div></div>
      <div class="feat-card">
        <div class="feat-thumb">${feat.name.split(' ').slice(0,2).map(w=>w[0]).join('')}</div>
        <div><div style="font-weight:700; font-size:15px;">Motherbase Featured Collectible</div><div style="color:var(--dim); font-size:13px; margin-top:2px;">${feat.name} - "${feat.blurb}"</div></div>
      </div>
      <div class="pill-select">
        ${featuredOptions.map((f,i)=>`<span class="pill ${i===state.featuredIndex?'sel':''}" onclick="state.featuredIndex=${i}; renderCMS();">${f.name}</span>`).join('')}
      </div>
    </div>
  </div>


  </div>`
  ;
}
function saveEntry(){
  const name=document.getElementById('entry-name').value.trim();
  if(!name) return;
  itemDetails.unshift({name, pct:0, status:'draft'});
  state.showAddEntry=false;
  renderCMS();
}
function cycleEntryStatus(i){
  const order=['draft','needsreview','published'];
  const cur=order.indexOf(itemDetails[i].status);
  itemDetails[i].status=order[(cur+1)%3];
  if(itemDetails[i].status==='published') itemDetails[i].pct=100;
  renderCMS();
}
function reviewFlag(i){ verifyFlags.splice(i,1); renderCMS(); }
function cyclePlatformStatus(i){
  const order=['draft','scheduled','posted'];
  const cur=order.indexOf(socialPosts[i].status);
  socialPosts[i].status=order[(cur+1)%3];
  renderCMS();
}
function addIronManMark(){
  const val=document.getElementById('im-new').value.trim();
  if(!val) return;
  ironManMarks.push(val);
  renderCMS();
}
RENDERERS.cms = renderCMS;

  </div>

  <div class="subview ${s==='client'?'active':''}">
    <div class="grid cols-3">
      <div class="panel-box"><h3 style="margin-bottom:6px;">Looking For</h3><p class="sub">Collectors Looking For this month</p>${barList(lookingForLog,' collectors')}</div>
      <div class="panel-box"><h3 style="margin-bottom:6px;">Trending franchises</h3><p class="sub">Searches this month.</p>${barList(trending.map(t=>({n:t.n,v:t.a})),' searches')}</div>
      <div class="panel-box"><h3 style="margin-bottom:6px;">Most viewed pages</h3><p class="sub">Collectible info-page views.</p>${barList(mostViewed,' views')}</div>
    </div>
    <div class="panel-box"><h3 style="margin-bottom:14px;">Collector interest by category</h3>${barList(catDist,'%')}</div>

  <div class="subview ${s==='sales'?'active':''}">

      <div class="stat-card"><div class="n">P204.5K</div><div class="l">This week's revenue</div><div class="d up">Up 9%</div></div>
      <div class="stat-card"><div class="n">P1,395,000</div><div class="l">Q3 revenue (Jul-Sep)</div><div class="d up">Combined</div></div>
      <div class="stat-card"><div class="n">35</div><div class="l">Top seller units - Gundam RX-78</div><div class="d">this month</div></div>
      <div class="stat-card"><div class="n">P52K</div><div class="l">Best live session - Live B</div><div class="d up">Sep 15</div></div>

    <div class="grid cols-3">

RENDERERS.analytics = renderAnalytics;

/* ================= INIT ================= */
renderDashboard(); renderInventory(); renderSupplier(); renderCMS(); renderAnalytics();
</script>
