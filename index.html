<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motherbase | Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 50%, rgba(255, 40, 40, 0.18), transparent 35%),
                radial-gradient(circle at 85% 50%, rgba(40, 70, 255, 0.20), transparent 35%),
                #070910;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .background-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(
                    90deg,
                    rgba(255, 30, 30, 0.06),
                    transparent 35%,
                    transparent 65%,
                    rgba(30, 60, 255, 0.07)
                );
        }

        .container {
            width: min(1050px, 94%);
            min-height: 620px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(10, 12, 20, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 24px;
            overflow: hidden;
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.65),
                0 0 50px rgba(60, 70, 255, 0.08);
            position: relative;
            z-index: 1;
        }

        .brand-section {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px;
            background:
                linear-gradient(
                    135deg,
                    rgba(180, 20, 30, 0.24),
                    rgba(10, 10, 20, 0.35) 48%,
                    rgba(25, 50, 180, 0.25)
                );
            overflow: hidden;
        }

        .brand-section::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255, 30, 30, 0.12);
            filter: blur(100px);
            left: -250px;
            top: 50%;
            transform: translateY(-50%);
        }

        .brand-section::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(30, 70, 255, 0.12);
            filter: blur(100px);
            right: -250px;
            top: 50%;
            transform: translateY(-50%);
        }

        .logo {
            width: min(430px, 100%);
            position: relative;
            z-index: 2;
            filter:
                drop-shadow(0 0 15px rgba(255, 30, 30, 0.25))
                drop-shadow(0 0 20px rgba(30, 60, 255, 0.25));
        }

        .brand-title {
            position: relative;
            z-index: 2;
            margin-top: 25px;
            text-align: center;
            font-size: 27px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .brand-description {
            position: relative;
            z-index: 2;
            max-width: 420px;
            margin-top: 12px;
            text-align: center;
            color: #aeb3c2;
            line-height: 1.6;
            font-size: 14px;
        }

        .form-section {
            padding: 55px 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(7, 9, 15, 0.82);
        }

        .form-container {
            width: 100%;
            max-width: 400px;
        }

        .form-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #9298aa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #111522;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 28px;
        }

        .tab {
            border: none;
            background: transparent;
            color: #858b9d;
            padding: 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.25s;
        }

        .tab.active {
            color: white;
            background: linear-gradient(135deg, #d7192c, #263fd0);
            box-shadow: 0 5px 18px rgba(70, 50, 180, 0.25);
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: #c7cad5;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 48px;
            background: #111522;
            border: 1px solid #252b3c;
            border-radius: 9px;
            color: white;
            padding: 0 15px;
            outline: none;
            transition: 0.2s;
        }

        .input-wrapper input:focus {
            border-color: #4257e8;
            box-shadow: 0 0 0 3px rgba(55, 75, 230, 0.10);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #777e91;
            cursor: pointer;
            font-size: 12px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 4px 0 24px;
            font-size: 12px;
        }

        .remember {
            display: flex;
            gap: 7px;
            align-items: center;
            color: #9298aa;
        }

        .remember input {
            accent-color: #db2637;
        }

        .forgot {
            color: #7082ff;
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .submit-button {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 9px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(100deg, #d7192c, #283fd1);
            box-shadow: 0 10px 25px rgba(80, 50, 190, 0.20);
            transition: 0.25s;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(80, 50, 190, 0.30);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #555c6e;
            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #252b3c;
            flex: 1;
        }

        .terms {
            text-align: center;
            color: #666d80;
            font-size: 11px;
            line-height: 1.5;
            margin-top: 20px;
        }

        .terms a {
            color: #7988ee;
            text-decoration: none;
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            font-size: 13px;
            background: rgba(40, 180, 100, 0.12);
            border: 1px solid rgba(40, 180, 100, 0.25);
            color: #7be0a4;
        }

        @media (max-width: 800px) {
            body {
                padding: 20px 0;
            }

            .container {
                grid-template-columns: 1fr;
                min-height: auto;
            }

            .brand-section {
                padding: 35px 25px;
            }

            .logo {
                width: 300px;
            }

            .brand-title {
                font-size: 22px;
            }

            .form-section {
                padding: 40px 25px;
            }
        }

        @media (max-width: 450px) {
            .container {
                width: 96%;
                border-radius: 16px;
            }

            .brand-section {
                padding: 25px 18px;
            }

            .logo {
                width: 250px;
            }

            .form-section {
                padding: 35px 20px;
            }

            .form-header h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="background-glow"></div>

    <main class="container">

        <section class="brand-section">

            <img
                src="motherbase-logo.png"
                alt="The Motherbase"
                class="logo"
            >

            <h2 class="brand-title">
                Welcome to Motherbase
            </h2>

            <p class="brand-description">
                Manage collectibles, explore product information,
                and connect with the collector community.
            </p>

        </section>


        <section class="form-section">

            <div class="form-container">

                <div class="form-header">
                    <h1 id="formTitle">Welcome Back</h1>
                    <p id="formSubtitle">
                        Sign in to continue to your Motherbase account.
                    </p>
                </div>


                <div class="tabs">

                    <button
                        class="tab active"
                        id="loginTab"
                        onclick="showLogin()"
                    >
                        Login
                    </button>

                    <button
                        class="tab"
                        id="registerTab"
                        onclick="showRegister()"
                    >
                        Register
                    </button>

                </div>


                <div class="message" id="message"></div>


                <!-- LOGIN -->

                <form
                    class="form active"
                    id="loginForm"
                    onsubmit="login(event)"
                >

                    <div class="input-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="email"
                                id="loginEmail"
                                placeholder="Enter your email"
                                required
                            >

                        </div>

                    </div>


                    <div class="input-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword('loginPassword', this)"
                            >
                                SHOW
                            </button>

                        </div>

                    </div>


                    <div class="options">

                        <label class="remember">

                            <input
                                type="checkbox"
                                id="remember"
                            >

                            Remember me

                        </label>

                        <a
                            href="#"
                            class="forgot"
                            onclick="forgotPassword(event)"
                        >
                            Forgot Password?
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="submit-button"
                    >
                        LOGIN
                    </button>

                </form>


                <!-- REGISTER -->

                <form
                    class="form"
                    id="registerForm"
                    onsubmit="register(event)"
                >

                    <div class="input-group">

                        <label for="registerName">
                            Full Name
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="text"
                                id="registerName"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>

                    </div>


                    <div class="input-group">

                        <label for="registerEmail">
                            Email Address
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="email"
                                id="registerEmail"
                                placeholder="Enter your email"
                                required
                            >

                        </div>

                    </div>


                    <div class="input-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Create a password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword('registerPassword', this)"
                            >
                                SHOW
                            </button>

                        </div>

                    </div>


                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                minlength="8"
                                required
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="submit-button"
                    >
                        CREATE ACCOUNT
                    </button>

                </form>


                <p class="terms">
                    By continuing, you agree to the
                    <a href="#">Terms of Service</a>
                    and
                    <a href="#">Privacy Policy</a>.
                </p>

            </div>

        </section>

    </main>


    <script>

        function showLogin() {

            document
                .getElementById("loginForm")
                .classList.add("active");

            document
                .getElementById("registerForm")
                .classList.remove("active");

            document
                .getElementById("loginTab")
                .classList.add("active");

            document
                .getElementById("registerTab")
                .classList.remove("active");

            document
                .getElementById("formTitle")
                .textContent = "Welcome Back";

            document
                .getElementById("formSubtitle")
                .textContent =
                "Sign in to continue to your Motherbase account.";

            hideMessage();
        }


        function showRegister() {

            document
                .getElementById("registerForm")
                .classList.add("active");

            document
                .getElementById("loginForm")
                .classList.remove("active");

            document
                .getElementById("registerTab")
                .classList.add("active");

            document
                .getElementById("loginTab")
                .classList.remove("active");

            document
                .getElementById("formTitle")
                .textContent = "Create Account";

            document
                .getElementById("formSubtitle")
                .textContent =
                "Register to start your Motherbase collector account.";

            hideMessage();
        }


        function togglePassword(inputId, button) {

            const input =
                document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";
                button.textContent = "HIDE";

            } else {

                input.type = "password";
                button.textContent = "SHOW";

            }
        }


        function login(event) {

            event.preventDefault();

            showMessage(
                "Login form submitted. Connect this form to your authentication system."
            );
        }


        function register(event) {

            event.preventDefault();

            const password =
                document.getElementById("registerPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {

                showMessage(
                    "Passwords do not match.",
                    true
                );

                return;
            }

            showMessage(
                "Registration form submitted. Connect this form to your authentication system."
            );
        }


        function forgotPassword(event) {

            event.preventDefault();

            showMessage(
                "Enter your email address to request a password reset."
            );
        }


        function showMessage(text, error = false) {

            const message =
                document.getElementById("message");

            message.textContent = text;
            message.style.display = "block";

            if (error) {

                message.style.color = "#ff8585";
                message.style.borderColor =
                    "rgba(255, 60, 60, 0.25)";
                message.style.background =
                    "rgba(255, 40, 40, 0.10)";

            } else {

                message.style.color = "#7be0a4";
                message.style.borderColor =
                    "rgba(40, 180, 100, 0.25)";
                message.style.background =
                    "rgba(40, 180, 100, 0.12)";
            }
        }


        function hideMessage() {

            document
                .getElementById("message")
                .style.display = "none";
        }

    </script>

</body>
</html>
